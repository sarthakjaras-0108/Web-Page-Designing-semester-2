<!DOCTYPE html>
<html>
<head>
    <title>Border Styles</title>
</head>

<body>

<p style="border:2px dashed red;">
    Dashed Border
</p>

<p style="border:2px solid blue;">
    Solid Border
</p>

<p style="border:4px double green;">
    Double Border
</p>

<p style="border:2px dotted black;">
    Dotted Border
</p>

</body>
</html>
